name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis y tests
        run: |
          flutter analyze
          flutter test

      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin secretos de firma: el APK se firma con una clave temporal y no se podrá instalar encima de otra versión."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/soundwave-release.jks
          cat > android/key.properties <<EOF
          storeFile=soundwave-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=soundwave
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SoundWave-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoundWave-apk
          path: SoundWave-${{ github.run_number }}.apk

      # Cada cambio en main publica una versión descargable desde la pestaña Releases.
      - name: Publicar release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SoundWave build ${{ github.run_number }}
          body: APK de prueba compilado automáticamente desde ${{ github.sha }}.
          files: SoundWave-${{ github.run_number }}.apk
